version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release that upstream pulls within a day or two never reaches a bump PR.
    cooldown:
      default-days: 2
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
  # The end-to-end test pins its images by digest and its driver packages by hash.
  - package-ecosystem: docker
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    ignore:
      # The e2e image must run the Python the Nix package ships (3.13), so it tests what
      # NixOS users get. The CI matrix covers newer Pythons.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker-compose
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
  - package-ecosystem: pip
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
