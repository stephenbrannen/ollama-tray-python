version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release that upstream pulls within a day or two never reaches a bump PR.
    cooldown:
      default-days: 2
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
  # The end-to-end test pins its images by digest and its driver packages by hash.
  - package-ecosystem: docker
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
  - package-ecosystem: docker-compose
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
  - package-ecosystem: pip
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
