name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag can point at a commit that never went through review on main.
      # Stop before the release job gets the write token.
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # PySide6 loads these system libraries at import, even on the offscreen platform.
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # A cache another workflow can write would feed the release build.
          enable-cache: false
      # A tag that disagrees with the package version would publish files named for the wrong release.
      - name: Require the tag to match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${TAG#v}" = "$version" || { echo "tag $TAG does not match pyproject.toml version $version"; exit 1; }
      - name: Build the source archive and wheel
        run: uv build
      # Bare file names let users run `sha256sum -c` in the directory they downloaded to.
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.whl > checksums.txt
      # Artifact attestations need a public repository (or an Enterprise plan).
      # On a private repository the step would fail, so skip it there.
      # It runs before the release exists, so a failed attestation never leaves a public release without one.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl
            dist/checksums.txt
      # --verify-tag refuses to create a tag, so the release can only attach to the pushed tag.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/*.whl dist/checksums.txt --verify-tag --generate-notes --title "$TAG"

  # A separate job keeps the cache token away from the release job's write
  # token, and gives it read-only permissions.
  cache:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ollama-tray
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build
