name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request makes the older run obsolete. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failure on one version must not hide the result on the other.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PySide6 loads these system libraries at import, even on the offscreen platform.
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyrefly check
      - run: uv run pytest --cov=ollama_tray --cov-report=term-missing --cov-fail-under=90

  nix:
    runs-on: ubuntu-latest
    # A cache miss compiles the trimmed PySide6, which took 6 to 10 minutes on 4 fast cores.
    # The runner has 4 slower cores, so this allows for a build several times slower.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      # Pull requests read the binary cache but never push to it, so
      # unreviewed code cannot put paths in the cache that users trust.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ollama-tray
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' }}
      - run: nix fmt -- --check flake.nix
      - run: nix build
      - run: nix flake check

  macos:
    runs-on: macos-latest
    # A cache miss compiles the trimmed PySide6. That took 46 minutes on the Linux runner,
    # and nothing has measured the macOS runner yet, so this allows about twice as long.
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov=ollama_tray --cov-report=term-missing --cov-fail-under=90
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # Pull requests read the binary cache but never push to it, so
      # unreviewed code cannot put paths in the cache that users trust.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ollama-tray
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' }}
      - run: nix build
      - run: nix flake check
