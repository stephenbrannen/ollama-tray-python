name: e2e

on:
  push:
    branches: [main]
  # Every pull request runs it, so the ruleset can require it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the older run obsolete. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    # The test drives the tray through a Linux tray host over D-Bus, inside Docker.
    # macOS has no such host, and its GitHub runners have no Docker.
    runs-on: ubuntu-latest
    # Each run pulls the Ollama image and the model (about 270 MB), then builds the test image.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: e2e/run.sh
