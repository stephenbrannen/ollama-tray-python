[project]
name = "ollama-tray"
version = "0.3.0"
description = "A Linux system tray icon that shows which models an Ollama server has loaded, and unloads them on demand."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "PySide6-Essentials>=6.11.1,<7",
    "requests>=2.31,<3",
    "urllib3>=2.2,<3",
]

[project.scripts]
ollama-tray = "ollama_tray.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "responses>=0.26",
    "ruff>=0.17",
    "pyrefly~=1.3.2",
    "pytest-cov>=7.1.0",
    "jeepney~=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_tray"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pyrefly]
project-includes = ["src", "tests", "e2e"]
# Tests import the shared fixtures as `tests.fixtures`, so the repository root must resolve.
# The end-to-end tests import `driver` and `conftest` as top-level modules, so `e2e` must too.
search-path = [".", "e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The coverage gate lives in CI only. The Nix build runs pytest with this config, and the Nix
# sandbox has no `pytest-cov`, so a `--cov` option here fails that build.
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]
