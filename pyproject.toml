[project]
name = "ollama-tray"
version = "0.1.0"
description = "A Linux system tray icon that shows which models an Ollama server has loaded, and unloads them on demand."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6~=6.12",
    "requests~=2.34",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "responses>=0.26",
    "ruff>=0.17",
    "pyrefly>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_tray"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pyrefly]
project-includes = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
