# A plain `pre-commit install` then installs the pre-push hook as well.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # The coverage gate runs before a push, not on every commit, because it needs the whole suite.
      - id: pytest-coverage
        name: pytest with coverage gate
        entry: uv run pytest --cov=ollama_tray --cov-fail-under=90 -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
